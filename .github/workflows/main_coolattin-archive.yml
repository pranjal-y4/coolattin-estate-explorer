# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Python app to Azure Web App - coolattin-live

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # See azure-deploy.yml: without lfs, coolattin.db arrives as a pointer file
      # and the deployed site fails to start.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create virtual environment and install dependencies
        run: |
          grep -v -E "^(torch|sentence-transformers|psycopg)" requirements.txt > requirements-azure.txt
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements-azure.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !venv/
            !.venv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B595DCBFB6B14A7CBD88CFFDD8B4712E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_531E15B405264710B83C6560479EE086 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_779CAD6F8DBB4D72A28E32586E3A37E0 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'coolattin-live'
          slot-name: 'Production'
          startup-command: 'antenv/bin/gunicorn --bind=0.0.0.0:$PORT --timeout 600 --workers 2 --worker-class gthread --threads 4 --access-logfile - --error-logfile - app:app'
