name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare requirements for Azure
        # psycopg not needed (using SQLite); sentence-transformers/torch too large
        run: cp requirements-azure.txt requirements.txt

      - name: Create deployment zip
        run: |
          zip -r deploy.zip . \
            -x "*.git*" \
            -x "venv/*" \
            -x ".venv/*" \
            -x "antenv/*" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x ".env.local" \
            -x ".env" \
            -x "*.db-wal" \
            -x "*.db-shm" \
            -x "*.db-wal.bak" \
            -x "*.db.bak" \
            -x "node_modules/*" \
            -x "exports/*" \
            -x ".claude/*" \
            -x "eval_results/*" \
            -x "*.zip"

      - name: Deploy via Kudu ZipDeploy
        run: |
          curl -X POST \
            "https://coolattin-app.scm.azurewebsites.net/api/zipdeploy?isAsync=false" \
            -u "${{ secrets.KUDU_USERNAME }}:${{ secrets.KUDU_PASSWORD }}" \
            -H "Content-Type: application/zip" \
            --data-binary @deploy.zip \
            --max-time 300 \
            --fail \
            -v 2>&1 | tail -20
