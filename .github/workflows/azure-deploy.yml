name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare requirements for Azure
        # psycopg not needed on Azure (using SQLite)
        run: cp requirements-azure.txt requirements.txt

      - name: Create deployment zip
        run: |
          zip -r deploy.zip . \
            -x "*.git*" \
            -x "venv/*" -x ".venv/*" -x "antenv/*" \
            -x "__pycache__/*" -x "*.pyc" \
            -x ".env.local" -x ".env" \
            -x "*.db-wal" -x "*.db-shm" -x "*.bak" \
            -x "exports/*" \
            -x "eval_results/*" -x "*.zip" \
            -x "docs/*" -x "eval/*" \
            -x "tests/*" -x "scripts/*" \
            -x "extra_datasets/NMS_OpenData_20230823.csv" \
            -x "data/entity_index.pkl" -x "data/source_snapshots/*" \
            -x ".pytest_cache/*" \
            -x "requirements-azure.txt"

      - name: Deploy to Azure via zip (Oryx builds packages on Azure)
        # Oryx on Azure reads requirements.txt and creates antenv automatically.
        # SCM_DO_BUILD_DURING_DEPLOYMENT=true is set in app settings.
        run: |
          az webapp deploy \
            --name coolattin-app \
            --resource-group coolattin-rg2 \
            --src-path deploy.zip \
            --type zip

      - name: Enforce startup command
        # Oryx resolves the gunicorn binary path from antenv automatically when
        # the startup command is set to the bare 'gunicorn ...' form.
        # This must run after each deploy so az webapp up cannot reset it to
        # 'bash /home/site/wwwroot/startup.sh' via startup.sh auto-detection.
        run: |
          az webapp config set \
            --name coolattin-app \
            --resource-group coolattin-rg2 \
            --startup-file "gunicorn --bind=0.0.0.0:\$PORT --timeout 600 --workers 2 --worker-class gthread --threads 4 --access-logfile '-' --error-logfile '-' app:app"

      - name: Verify app is responding
        run: |
          echo "Waiting 30s for site to settle..."
          sleep 30
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://coolattin-app.azurewebsites.net/)
            echo "Attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 15
          done
          echo "App did not return 200 after 5 attempts"
          exit 1
